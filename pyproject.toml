[tool.black]
# use flake8's line-length
line-length = 120
target-version = ['py38', 'py39', 'py310']
skip-string-normalization = true
exclude = '''
(
    /(
        | blade_llm\/evals\/opencompass_extension\/configs\/*
        | blade_llm\/third_party\/*
        | benchmark\/blm_insight\/\.quant\/*
        | benchmark\/blm_insight\/\.split\/*
    )/
    | \/blade_llm\/version.py
)
'''
